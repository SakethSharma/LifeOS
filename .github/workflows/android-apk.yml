
name: Build LifeOS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The Android app runs from https://localhost on the phone, so it needs the
      # address of a deployed HTTPS AI backend. Set the repository variable
      # LIFEOS_AI_BACKEND_URL (Settings → Secrets and variables → Actions →
      # Variables), e.g. https://your-site.example. It's a public URL, not a secret.
      - name: Build Angular production app
        env:
          LIFEOS_AI_BACKEND_URL: ${{ vars.LIFEOS_AI_BACKEND_URL }}
        run: |
          if [ -z "$LIFEOS_AI_BACKEND_URL" ]; then
            echo "::warning::LIFEOS_AI_BACKEND_URL is not set; AI will show 'AI isn't available here yet' in this APK."
          elif ! echo "$LIFEOS_AI_BACKEND_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$'; then
            echo "::error::LIFEOS_AI_BACKEND_URL must be an https:// address with no path."
            exit 1
          fi
          npm run build -- --configuration production --define "LIFEOS_AI_BACKEND_URL='${LIFEOS_AI_BACKEND_URL%/}'"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
