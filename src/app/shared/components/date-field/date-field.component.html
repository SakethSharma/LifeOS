<div class="form-control date-field" (click)="openPicker()">
  <span class="date-text" [class.placeholder]="!display()">
    {{ display() || "Select date" }}
  </span>

  <svg
    class="date-icon"
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="4" width="18" height="18" rx="2" />
    <line x1="16" y1="2" x2="16" y2="6" />
    <line x1="8" y1="2" x2="8" y2="6" />
    <line x1="3" y1="10" x2="21" y2="10" />
  </svg>

  <input
    #native
    class="date-native"
    type="date"
    [value]="value()"
    [attr.aria-label]="ariaLabel()"
    (change)="onChange($event)"
  />
</div>
