<button
  #trigger
  type="button"
  class="form-control select-trigger"
  [class.open]="open()"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="uid + '-list'"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-activedescendant]="
    open() && activeIndex() >= 0 ? uid + '-opt-' + activeIndex() : null
  "
  [disabled]="disabled()"
  (click)="onTriggerClick()"
  (keydown)="onKeydown($event)"
>
  <span class="select-value" [class.placeholder]="!selectedLabel()">
    {{ selectedLabel() || placeholder() }}
  </span>

  <svg
    class="chevron"
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <polyline points="6 9 12 15 18 9" />
  </svg>
</button>

@if (open()) {
  <ul
    #panel
    class="select-panel"
    role="listbox"
    [id]="uid + '-list'"
    [style.left.px]="pos().left"
    [style.width.px]="pos().width"
    [style.top.px]="pos().top"
    [style.bottom.px]="pos().bottom"
    [style.max-height.px]="pos().maxHeight"
  >
    @for (option of options(); track option.value; let i = $index) {
      <li
        role="option"
        class="select-option"
        [id]="uid + '-opt-' + i"
        [class.active]="i === activeIndex()"
        [class.selected]="option.value === value()"
        [attr.aria-selected]="option.value === value()"
        (click)="choose(option)"
        (mouseenter)="activeIndex.set(i)"
      >
        {{ option.label }}
      </li>
    }
  </ul>
}
