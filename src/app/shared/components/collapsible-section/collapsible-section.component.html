<div class="collapsible" [class.is-collapsed]="!expanded()">
  <button
    type="button"
    class="collapsible-toggle"
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="bodyId"
  >
    <div class="collapsible-header-slot">
      <ng-content select="[collapsible-header]"></ng-content>
    </div>

    <span class="collapsible-chevron" [class.open]="expanded()" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </span>
  </button>

  @if (expanded()) {
    <div class="collapsible-body" [id]="bodyId">
      <ng-content></ng-content>
    </div>
  }
</div>
